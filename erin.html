<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>🐄 牛吃草 - HTML 貪吃蛇</title>
<style>
    body {
        background: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: white;
        font-family: Arial, sans-serif;
    }
    canvas {
        background: #333;
        border: 4px solid #666;
    }
</style>
</head>
<body>

<canvas id="game" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const CELL = 30;
const GRID_W = canvas.width / CELL;
const GRID_H = canvas.height / CELL;

// 牛（蛇）初始位置
let cow = [{ x: Math.floor(GRID_W / 2), y: Math.floor(GRID_H / 2) }];
let direction = { x: 1, y: 0 };

// 草（食物）產生
function spawnGrass() {
    let pos;
    do {
        pos = {
            x: Math.floor(Math.random() * GRID_W),
            y: Math.floor(Math.random() * GRID_H)
        };
    } while (cow.some(seg => seg.x === pos.x && seg.y === pos.y));
    return pos;
}

let grass = spawnGrass();

// 方向鍵控制
document.addEventListener("keydown", e => {
    if (e.key === "ArrowUp" && direction.y !== 1) direction = { x: 0, y: -1 };
    if (e.key === "ArrowDown" && direction.y !== -1) direction = { x: 0, y: 1 };
    if (e.key === "ArrowLeft" && direction.x !== 1) direction = { x: -1, y: 0 };
    if (e.key === "ArrowRight" && direction.x !== -1) direction = { x: 1, y: 0 };
});

// 畫 emoji
function drawEmoji(emoji, x, y) {
    ctx.font = "26px Arial";
    ctx.fillText(emoji, x * CELL + 3, y * CELL + 26);
}

// 遊戲主迴圈
function gameLoop() {
    // 移動牛
    let head = {
        x: cow[0].x + direction.x,
        y: cow[0].y + direction.y
    };

    // 撞牆
    if (head.x < 0 || head.x >= GRID_W || head.y < 0 || head.y >= GRID_H) {
        return gameOver();
    }

    // 撞到自己
    if (cow.some(seg => seg.x === head.x && seg.y === head.y)) {
        return gameOver();
    }

    cow.unshift(head);

    // 吃草
    if (head.x === grass.x && head.y === grass.y) {
        grass = spawnGrass();
    } else {
        cow.pop();
    }

    // 畫面
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 畫草
    drawEmoji("🌱", grass.x, grass.y);

    // 畫牛身體
    for (let i = 1; i < cow.length; i++) {
        drawEmoji("🟫", cow[i].x, cow[i].y);
    }

    // 畫牛頭
    drawEmoji("🐄", cow[0].x, cow[0].y);

    setTimeout(gameLoop, 120);
}

function gameOver() {
    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.fillText("💀 牛撞到了！遊戲結束", 120, 280);
    ctx.font = "30px Arial";
    ctx.fillText("得分：" + (cow.length - 1), 230, 330);
}

gameLoop();
</script>

</body>
</html>
